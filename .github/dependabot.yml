version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # devDependencies only — plugins ship with zero runtime dependencies.
  - package-ecosystem: npm
    directories:
      - /
      - /plugins/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      dev-dependencies-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # @types/node majors track the Node runtime; bump them together with engines.node and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
