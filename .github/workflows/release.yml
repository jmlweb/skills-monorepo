name: Release

on:
  push:
    tags:
      - "plugins/*/v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN=$(echo "$TAG" | cut -d'/' -f2)
          VERSION=$(echo "$TAG" | cut -d'/' -f3)
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREV_TAG=$(git tag --sort=-version:refname | grep "plugins/$PLUGIN/" | sed -n '2p')
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./plugins/$PLUGIN/package.json').version")
          if [ "v$PKG_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag says $VERSION but plugins/$PLUGIN/package.json says v$PKG_VERSION."
            exit 1
          fi

      - name: Build plugin-scoped release notes
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          PREV_TAG: ${{ steps.tag.outputs.prev_tag }}
        run: |
          RANGE="$GITHUB_REF_NAME"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo ""
            git log --no-merges --pretty='- %s (%h)' "$RANGE" -- "plugins/$PLUGIN" \
              | grep -v '^- chore: release ' || echo "- No plugin changes"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full diff**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$GITHUB_REF_NAME"
            fi
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$PLUGIN $VERSION" \
            --notes-file notes.md
