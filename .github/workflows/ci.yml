name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 22 is the declared engines minimum; 24 is the active LTS most users run.
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint skills
        run: pnpm lint:skills --strict

      - name: Test
        run: pnpm test

      - name: Check dist is up-to-date
        run: |
          if ! git diff --exit-code -- '*/dist/**'; then
            echo ""
            echo "ERROR: dist/ is out of date."
            echo "Run 'pnpm build' locally and commit the result."
            exit 1
          fi

      - name: Check version sync
        run: |
          pnpm version:sync
          if ! git diff --exit-code -- '.claude-plugin/marketplace.json'; then
            echo ""
            echo "ERROR: marketplace.json is out of sync."
            echo "Run 'pnpm version:sync' locally and commit the result."
            exit 1
          fi

      - name: Check versions are consistent
        run: pnpm version:check

      - name: Check backlog index and status/folder consistency
        run: pnpm backlog:check

      - name: Check reserved names and stale dist files
        run: pnpm names:check
